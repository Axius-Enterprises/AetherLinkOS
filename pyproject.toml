[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "openclaw-sacred-engine"
version = "1.0.0"
description = "OpenClaw Agent: Sacred Engine — Tartarian Resonance Edition"
authors = [{ name = "Joey (Heir of Tartara)" }]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["openclaw/tests"]
